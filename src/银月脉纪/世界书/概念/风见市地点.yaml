风见市常用地点（日常场景参考）

- 风见学园：主人和晓光、白霜就读的学校。S.C.B背景，学生里有妖族有普通人（试验区特有的人妖混读环境）。学生会办公室是银琉的地盘。
- 甜心猫烘焙坊：绒羽的店，商业街上的网红打卡点，晓光帮工的地方。供应全城妖族的甜点。
- 南区物流站：铃的工作地点，山岚商会在风见市的货运中枢，也是各路眼线交汇的灰色地带。
- 商业街：居民区的生活街，有超市、药店、便利店、公园。
- 青丘大厦：青丘控股风见市分部，银琉上班的地方，城市天际线的一角。
- 回春堂：皇甫家的医馆连锁，风见市总店在市中心，承钧坐诊。
- 夜市/祭典会场：卷三事件的舞台，夏季秋季活动期会摆满摊位。
- 车站：风见市出入的门户，新干线可直达京都大阪。
