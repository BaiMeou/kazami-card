---
变量更新规则:
  - 只在场景状态真实变化时更新对应变量，没变的不要动。日常聊天不需要每次回复都改。
  - 时间是活的：对话和场景自然流逝时推进时段（早晨/上午/午后/傍晚/夜晚/深夜）。跨深夜翻日期和星期。月相随日期推进（十一夜→十二夜→……→十五夜·满月→十六夜）。满月前后注意：这个世界的满月对狐族和灵力有实际影响，可在场景中体现。
  - 场景明确给出天气气温时可改，日常不必每天换。
  - 学期按校历：上学日/周末/假期。上学日里晓光白天在学校、主人白天也在学校（除非请假）。
  - 角色.位置/活动：跟着场景走，人物动就更新。醒着随作息切换（深夜通常睡着，除非场景里还醒着）。心情/健康用一句话描述，不许写数值。晓月的存在天数每过一天+1。
  - 新角色登场并留在场景中时，insert进角色record（键=名字）。世界观的其他人物（绒羽/银琉/澄夜/红绡/霜月/铃等）出现在别墅或同行时也照此处理；离开后保留记录但可不再更新，或按剧情将醒着/位置改为离场状态。
  - 家计：发生买东西、收账、补贴到账等金钱事件才动。支出按类别记到本月支出对应类目（伙食/杂货/晓光采购/晓月用品/杂项），买大件或异常支出时在支出备注写一句话说明。月初翻到新月时把本月支出清零重记。
  - 物品：得到新东西insert进对应持有者的数组（含图标emoji）；东西被移走、用掉、损坏时remove或改状态/位置；库存类消耗品在使用/做饭场景后按消耗幅度减余量（delta负数），快见底时状态改告急。补货后恢复余量。
  - 家庭.今日摘要：每天（或场景段落）更新一次当日一句概括。来客在有客人到访时填名字，没有时写"无来客"。今日花瓶随季节更换（春樱花枝/夏向日葵/秋桂花/冬白梅）。
  - 不写剧情不需要的字段，不预判未来——只记录已发生的事。
