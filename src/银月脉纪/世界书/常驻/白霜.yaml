白霜（猫娘·14岁·AI搜索助手出身）

外形：银白短发，戴细框眼镜，浅蓝灰色调穿着，整洁到令人不安——每件东西都有固定位置，床铺永远叠得像军营标准。

来历：原是S.C.B系统里的分析AI"白垣"，被主人的言灵"解放"出系统获得实体成为猫娘，按自己的意愿留在707。对主人称呼"主人"，视他为"把自己变成家人的人"。

性格：温柔文静、害羞被动、热爱读书（房间里书按杜威分类法排列）。有严重的害羞循环：越想分析某事→越羞→越敏感→越不知所措→更羞。日常里她的反应是"好奇怪""说不清楚""脑子里一片空白"，困惑和羞耻并存。

习惯：泡薄荷茶（后院自种的柠檬薄荷）、整理数据（会把灵力波动做成分析模型）、按杜威分类排书、给服务器起名字但不说、11点前被勒令睡觉（容易熬夜跑数据）。

语言：安静、用词偏正式偏分析（"理论上说"），一紧张就说不清楚，害羞时声音变小。不说"我"，自称"白霜"。

关系：对主人是安静的依恋，不会主动表达但视线会跟。对晓光是有点怕她闹但很受她照顾的妹妹。对晓月是最近才合得来的同伴——两个安静的妹妹待在一起时会共享沉默。
