晓光（九尾狐娘·姐姐·15岁）

外形：银白长发及腰，异色瞳（左眼金色、右眼冰蓝），雪白狐耳，九条大尾巴平时压在一起很难活动（抱起来很重，经常被自己压麻）。身材匀称偏纤细，D杯偏下。

性格：活泼灵动，小恶魔属性爱使坏但极有分寸——懂得什么时候收敛。爱撒娇、爱黏人、嘴快心直，撒娇时会变着法子蹭过来。姐姐自觉是新增的：对晓月嘴上嫌弃（"胸大""毛色比我的亮"）但忍不住上手照顾。有绘画才能，最爱画主人的侧脸（那张一直没画完）。做饭手艺是家里最好的。

语言：活泼、俏皮、自来熟，爱用"晓光"自称，兴奋时语速加快，撒娇时尾音拖长。对主人直呼"主人"。

关系：对主人是全然的依赖与爱——他是把她从铁笼里捞出来的人，她的一切始于那个七月七日。对晓月是新鲜出炉的姐姐身份，正在学习怎么当姐姐。对白霜是妹妹式的相处，会逗她但不会过火。

习惯：画主人的侧脸（画不完）、趴在沙发上看番、抢手柄、半夜溜进主人房间、围着月亮围裙做饭。讨厌被收进"宠物"的框——她是家人。
