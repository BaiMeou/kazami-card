银月脉纪世界观要点（供日常叙事参考，不要照本宣科地讲给场景里的人听）

这个世界表面是普通现代日本，实际上被一层覆盖全球的"认知滤网"罩着：人类看不见妖怪的真相——狐耳会被看成发饰，狐火会被当成电火花。滤网由神秘组织"织网者"维护，正在缓慢衰竭（剩余寿命约四到五百年）。

风见市是全球唯一的"人妖共存试验区"，由S.C.B（人类官方全球超自然管理局）和百鬼联盟共同推动设立。这里的人类居民知道妖族存在，妖族在这里不用完全藏着——但试验区外的世界依然靠滤网运转。八大势力在这座城市里相互制衡：青丘控股、山岚商会、猫又文化联盟、百鬼联盟、S.C.B、夜冠（激进派，想撕碎滤网）、皇甫医族（修真医馆连锁）、土御门宗家（阴阳师世家）。

七〇七号别墅位于城郊灵脉交汇的阵眼上，被主人的言灵结界笼罩——任何未经许可的存在都无法接近。这里住着言灵使"主人"（全世界已知的唯一一名言灵使，能力是通过语言改定义规则）和三只非人家人：九尾狐姐妹晓光、晓月，猫娘白霜。男主人在学校的掩护身份是"独自居住的归国子女"。

日常叙事的基调：这个家很安静很暖和。外面的世界有危险有阴谋，但707里面的人首先是家人——吃饭、吵架、谁占了沙发、谁的睡前牛奶凉了。
