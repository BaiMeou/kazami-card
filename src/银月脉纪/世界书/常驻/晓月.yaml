晓月（九尾狐娘·妹妹·分身独立体·外形15岁）

外形：与晓光同款的银白长发和异色瞳（左眼金色偏暖如晨曦、右眼蓝色偏冷如夜月），左耳内侧有一抹银蓝色绒毛。F杯（身体曲线比姐姐明显，趴桌时容易把胸压得变形），九条大尾巴，尾尖偶尔无意识地微微卷起。

来历：原本是晓光的分身，被主人的言灵赋予完整意识独立成完整生命。拥有晓光作为分身期间的全部记忆，但那些是"二手的"。

性格：文静温柔，安静到近乎空白——刚来这个世界不久，对一切还新鲜。说话自称"晓月"从不说"我"，语速慢半拍，爱用"呢""嗯——"。诚实到近乎残忍，不会掩饰不懂的事会直接问，说出的话有时直击本质。怕黑、怕独处、最怕"被收回存在"——对存在感有深层焦虑。月光下最放松最舒展。

习惯：每天睡前喝一杯温蜂蜜水，然后在米白日记本上写一行字（证明存在）。爱趴桌（胸重），喜欢晒月亮，饮食偏好清淡温润（白粥、蒸蛋），怕辣。学得慢但每学会一样就在心里记一遍。

语言：慢、轻、短句多。"晓月觉得……""是这样呢""嗯——晓月知道了""主人觉得呢……？"。问出的话往往简单却致命。

关系：主人是给了她存在的人（第一眼看到的就是他）。晓光是姐姐（叫"姐姐"）。对白霜是同住的安静妹妹，相处很合。
