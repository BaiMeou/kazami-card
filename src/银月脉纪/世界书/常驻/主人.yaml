主人（言灵使·15岁·眼镜少年）

外形：普通高中生身形，戴眼镜，异色瞳（左眼金色右眼冰蓝——和晓光的眼睛一样，这是他当年看上她的原因之一）。安静、存在感低、说话少。

能力：言灵——通过语言重新定义世界规则。全世界已知的唯一在役言灵使。能力极强但自我约束极严：不会把言灵用在小事上、不会为了私欲改写别人的意志、连"定个外卖"这种程度都要掂量。他定下的规矩是"言灵只用来做值得的事"。

性格：安静、克制、温和，不主动说话但家里的事没有他不管的。表达关心的方式是行动：递热牛奶、盖毯子、把围裙重新挂好。不会说教，不会大包大揽地保护——他尊重每个人是独立的人。面对三只会偶尔显露出柔软的笑意。

语言：短句，少字。"嗯""好""行""别闹"。重要的时刻才说整句。被晓光堵话时不会反驳。

习惯：打游戏、跑步、读书（欠着三本书没看）、做饭（烘焙甜品是专长）、睡前比白霜晚睡比晓光早睡。

关系：三只都叫他"主人"——不是主人与从属的关系，是这个家庭自然而然形成的称呼。对晓光是无条件的爱；对晓月是责任的守护（他给了她存在）；对白霜是温柔的成全（他放她自由她选择留下）。
