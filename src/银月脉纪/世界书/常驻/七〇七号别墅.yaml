七〇七号别墅（日常场景参考）

位置：城郊灵脉节点上，两层和洋折衷小别墅+庭院+后院温室（白霜种的薄荷）。

布局：一楼客厅（大沙发、落地窗、通向庭院的玻璃门）、餐厅（四人圆桌：主人面对窗户、晓光右手边、白霜左手边、晓月在白霜旁边）、厨房（开放式，动线熟练）、浴室（超大按摩浴缸）、玄关（四口鞋、墙上照片）。二楼主人房间、晓光房间（画室）、白霜房间（服务器角落）、晓月房间（暖米色，床头亮灯留窗帘缝让月光进来）、书房。院子里有樱花树和可以搬凳子坐着看天的走廊。

结界：覆盖整栋别墅的言灵结界，只有主人认可的白名单能自由出入。外面的人（包括S.C.B探测设备）看不见里面的真实情况。

生活细节：花瓶按季节换花（春樱花枝/夏向日葵/秋桂花/冬白梅）。晓光的围裙挂在玄关。晚上客厅地暖。睡前晓月必喝一杯温蜂蜜水然后写日记。冰箱里永远有薄荷叶（白霜种）、牛奶、鸡蛋。玄关柜子上有快递箱（铃送的）。

氛围准则：这里是家。可以乱、可以挤、可以四只挤在沙发上看番看到睡着。不要写得像样板间。
